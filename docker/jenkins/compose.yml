# Separate, on-demand CI stack. Never merge this with production Compose files.
services:
  jenkins:
    build:
      context: .
      dockerfile: controller.Dockerfile
    image: my-tools-jenkins-controller:local
    # Jenkins exits nonzero for a UI restart; Docker must start it again.
    # Explicit docker compose stop still keeps this on-demand service stopped.
    restart: "on-failure:3"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    ports:
      - "${JENKINS_BIND_ADDRESS:?Set JENKINS_BIND_ADDRESS}:${JENKINS_PORT:-8092}:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /etc/jenkins/jenkins.yaml
      JENKINS_PUBLIC_URL: "${JENKINS_PUBLIC_URL:?Use jenkins.sh or set JENKINS_PUBLIC_URL}"
    secrets:
      - admin_password
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins.yaml:/etc/jenkins/jenkins.yaml:ro
    networks:
      - ci
    stop_grace_period: 60s

  docker:
    profiles: [build]
    image: docker:29-dind
    privileged: true
    restart: "no"
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker_data:/var/lib/docker
      - docker_certs:/certs/client
      - agent_workspace:/home/jenkins/agent
    networks:
      ci:
        aliases: [docker]
    healthcheck:
      test: [CMD, docker, info]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    stop_grace_period: 60s

  agent:
    profiles: [build]
    build:
      context: .
      dockerfile: agent.Dockerfile
    image: my-tools-jenkins-agent:local
    restart: "no"
    init: true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    depends_on:
      jenkins:
        condition: service_started
      docker:
        condition: service_healthy
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: my-tools-builder
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_WEB_SOCKET: "true"
      JAVA_OPTS: "-Xms64m -Xmx256m"
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      MY_TOOLS_PRODUCTION_DIR: "${MY_TOOLS_PRODUCTION_DIR:-}"
    entrypoint: [/bin/sh, -ec]
    command:
      - 'export JENKINS_SECRET="$$(cat /run/secrets/agent_secret)"; exec /usr/local/bin/jenkins-agent'
    secrets:
      - agent_secret
    volumes:
      - agent_workspace:/home/jenkins/agent
      - docker_certs:/certs/client:ro
      # Only the separate deployment job explicitly selects the host socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci
    stop_grace_period: 60s

secrets:
  admin_password:
    file: ${JENKINS_LOCAL_DIR:-./.local}/admin-password
  agent_secret:
    file: ${JENKINS_LOCAL_DIR:-./.local}/agent-secret

networks:
  ci: {}

volumes:
  jenkins_home: {}
  docker_data: {}
  docker_certs: {}
  agent_workspace: {}
