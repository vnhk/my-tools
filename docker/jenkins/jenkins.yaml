jenkins:
  systemMessage: "On-demand My Tools CI. Separate production deployment job uses local Docker."
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${admin_password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  nodes:
    - permanent:
        name: my-tools-builder
        labelString: my-tools-builder
        remoteFS: /home/jenkins/agent
        numExecutors: 1
        mode: EXCLUSIVE
        launcher:
          inbound: {}
unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL}"
